<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-4">
                <h3 class="mb-4">🔎 Localizar aluno</h3>

                <form th:action="@{/localizar}" method="post" class="mb-3">
                    <div class="mb-3">
                        <label class="form-label">Nome do aluno</label>
                        <input type="text" class="form-control" name="nome"
                               th:value="${nomeBuscado}"
                               placeholder="Digite o nome do aluno" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Buscar em todos os campus</button>
                </form>

                <div th:if="${pesquisado}">
                    <div th:if="${encontrado}" class="alert alert-success">
                        ✅ Aluno <strong th:text="${nomeBuscado}"></strong> localizado no campus
                        <strong th:text="${campusEncontrado}"></strong>.
                    </div>
                    <div th:unless="${encontrado}" class="alert alert-warning">
                        ⚠️ Aluno não localizado em nenhum campus.
                    </div>
                </div>

                <a href="/" class="btn btn-link mt-3">&larr; Voltar ao menu</a>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments :: scripts}"></footer>
</body>
</html>
