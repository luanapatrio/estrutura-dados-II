<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão de Pedido Simplificada</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>

<body>

  <div class="container mt-5">
    <h2 class="mb-4">Lista de Itens do Pedido</h2>

    <div class="d-flex justify-content-end mb-3">
      <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modalAdicionar">
        + Adicionar Item
      </button>
    </div>

    <table id="tabelaPedido" class="table table-bordered table-striped">
      <thead>
        <tr>
          <th>ID</th>
          <th>Item</th>
          <th>Descrição</th> <!-- NOVO CABEÇALHO -->
          <th>Quantidade</th>
          <th>Valor Unitário (R$)</th>
          <th>Valor Total (R$)</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="corpoTabela"></tbody>
      <tfoot>
        <tr>
          <td colspan="5" class="text-end fw-bold">Total Geral:</td>
          <td colspan="2" id="totalGeral" class="fw-bold">R$ 0,00</td>
        </tr>
      </tfoot>
    </table>
  </div>

  <!-- MODAL: Adicionar Item -->
  <div class="modal fade" id="modalAdicionar" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="formAdicionar">
          <div class="modal-header">
            <h5 class="modal-title">Adicionar Item</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label">Nome do Item</label>
              <input type="text" id="addNome" class="form-control" required>
            </div>
            <!-- NOVO CAMPO DESCRIÇÃO -->
            <div class="mb-3">
              <label class="form-label">Descrição</label>
              <input type="text" id="addDescricao" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Quantidade</label>
              <input type="number" id="addQuantidade" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Valor Unitário</label>
              <input type="number" step="0.01" id="addValor" class="form-control" required>
            </div>
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-primary">Salvar</button>
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- MODAL: Editar Item -->
  <div class="modal fade" id="modalEditar" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="formEditar">
          <div class="modal-header">
            <h5 class="modal-title">Editar Item</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="editId">
            <div class="mb-3">
              <label class="form-label">Nome do Item</label>
              <input type="text" id="editNome" class="form-control" required>
            </div>
            <!-- NOVO CAMPO DESCRIÇÃO -->
            <div class="mb-3">
              <label class="form-label">Descrição</label>
              <input type="text" id="editDescricao" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Quantidade</label>
              <input type="number" id="editQuantidade" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Valor Unitário</label>
              <input type="number" step="0.01" id="editValor" class="form-control" required>
            </div>
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-primary">Salvar Alterações</button>
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
  <script src="script.js"></script>
</body>

</html>
